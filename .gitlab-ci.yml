stages: [tests, build]

workflow:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'

variables:
  GIT_DEPTH: "0"
  MAVEN_IMAGE: "maven:3.9-eclipse-temurin-21@sha256:99e61abcff91a9b1333463bd8451fb18495d6eba9250ac66a338b518f8278320"

default:
  tags: [project10]
  before_script:
    - mkdir -p reports
  after_script:
    - docker run --rm -v "$CI_PROJECT_DIR:/work" alpine:3.22 chown -R "$(id -u):$(id -g)" /work
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/]

secrets:
  stage: tests
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/src" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /src --gitleaks-ignore-path /src/.gitleaksignore --log-opts="--all" --redact --report-format json --report-path /src/reports/gitleaks.json

hadolint:
  stage: tests
  script:
    - docker run --rm -i hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint --format json - < Dockerfile > reports/hadolint.json

dependencies:
  stage: tests
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/work" -v project10-ci-maven:/root/.m2 -w /work "$MAVEN_IMAGE" mvn -B -ntp -DskipTests package > reports/dependency-build.log 2>&1
    - docker run --rm -v "$CI_PROJECT_DIR:/work" -v trivy-cache:/root/.cache/ aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb rootfs --timeout 15m --quiet --scanners vuln --format json --output /work/reports/trivy-dependencies.json /work/target
    - python3 scripts/check-severity.py reports/trivy-dependencies.json

sonarqube:
  stage: tests
  script:
    - docker run --rm -e SONAR_TOKEN -e SONAR_HOST_URL -v "$CI_PROJECT_DIR:/work" -v project10-ci-sonar-maven:/root/.m2 -w /work "$MAVEN_IMAGE" mvn -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar -Dsonar.projectKey="$SONAR_PROJECT_KEY" -Dsonar.projectName=Project10Final -Dsonar.qualitygate.wait=true -Dspring.docker.compose.enabled=false > reports/sonar-analysis.log 2>&1
    - cp target/site/jacoco/jacoco.xml reports/jacoco.xml
    - python3 scripts/check-sonar.py

build_publish:
  stage: build
  resource_group: harbor-publish
  script:
    - IMAGE="$HARBOR_REGISTRY/$HARBOR_PROJECT/petclinic:$CI_COMMIT_SHA"
    - docker build --pull -t "$IMAGE" . > reports/docker-build.log 2>&1
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$CI_PROJECT_DIR/reports:/reports" goodwithtech/dockle@sha256:eade932f793742de0aa8755406c7677cd7696f8675b6180926f7eeffa7abe6b9 --exit-code 1 --exit-level WARN --format json --output /reports/dockle.json "$IMAGE"
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$CI_PROJECT_DIR/reports:/reports" -v trivy-cache:/root/.cache/ aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image --timeout 15m --quiet --scanners vuln --format json --output /reports/trivy-image.json "$IMAGE"
    - python3 scripts/check-severity.py reports/trivy-image.json
    - export DOCKER_CONFIG="$(mktemp -d)"
    - trap 'rm -rf "$DOCKER_CONFIG"' EXIT
    - printf '%s' "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" --username "$HARBOR_USER" --password-stdin
    - docker push "$IMAGE" > reports/image-push.log 2>&1
    - docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' > reports/image-digest.json
