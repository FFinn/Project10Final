stages: [tests, build]

variables:
  GIT_DEPTH: "0"
  MAVEN_IMAGE: "maven:3.9-eclipse-temurin-21@sha256:99e61abcff91a9b1333463bd8451fb18495d6eba9250ac66a338b518f8278320"

default:
  tags: [project10]
  before_script:
    - mkdir -p reports
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/]

secrets:
  stage: tests
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/src" zricethezav/gitleaks:latest git /src --log-opts="--all" --redact --report-format json --report-path /src/reports/gitleaks.json

hadolint:
  stage: tests
  script:
    - docker run --rm -i hadolint/hadolint:latest hadolint --format json - < Dockerfile > reports/hadolint.json

dependencies:
  stage: tests
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/work" -v project10-ci-maven:/root/.m2 -w /work "$MAVEN_IMAGE" mvn -B -ntp -DskipTests package > reports/dependency-build.log 2>&1
    - docker run --rm -v "$CI_PROJECT_DIR:/work" -v trivy-cache:/root/.cache/ aquasec/trivy:latest fs --timeout 15m --quiet --scanners vuln --format json --output /work/reports/trivy-dependencies.json /work/target
    - python3 scripts/check-severity.py reports/trivy-dependencies.json

sonarqube:
  stage: tests
  script:
    - docker run --rm -e SONAR_TOKEN -e SONAR_HOST_URL -v "$CI_PROJECT_DIR:/work" -v project10-ci-sonar-maven:/root/.m2 -w /work "$MAVEN_IMAGE" mvn -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey="$SONAR_PROJECT_KEY" -Dsonar.qualitygate.wait=true -Dspring.docker.compose.enabled=false > reports/sonar-analysis.log 2>&1
    - cp target/site/jacoco/jacoco.xml reports/jacoco.xml

build_publish:
  stage: build
  resource_group: harbor-publish
  script:
    - IMAGE="$HARBOR_REGISTRY/$HARBOR_PROJECT/petclinic:$CI_COMMIT_SHA"
    - docker build --pull -t "$IMAGE" . > reports/docker-build.log 2>&1
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$CI_PROJECT_DIR/reports:/reports" goodwithtech/dockle:latest --exit-code 1 --exit-level WARN --format json --output /reports/dockle.json "$IMAGE"
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$CI_PROJECT_DIR/reports:/reports" -v trivy-cache:/root/.cache/ aquasec/trivy:latest image --timeout 15m --quiet --scanners vuln --format json --output /reports/trivy-image.json "$IMAGE"
    - python3 scripts/check-severity.py reports/trivy-image.json
    - export DOCKER_CONFIG="$(mktemp -d)"
    - trap 'rm -rf "$DOCKER_CONFIG"' EXIT
    - printf '%s' "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" --username "$HARBOR_USER" --password-stdin
    - docker push "$IMAGE" > reports/image-push.log 2>&1
    - docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' > reports/image-digest.json
