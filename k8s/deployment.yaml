apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: {app: petclinic}
  template:
    metadata:
      labels: {app: petclinic}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: harbor-pull}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: petclinic
          image: harbor.project10.internal:30443/project10/petclinic@sha256:ee5a2a4cbe36142deb5ba139d0b99d80c01333fcec00651746174de1e95940f5
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: postgres}
            - {name: SERVER_SERVLET_SESSION_COOKIE_SAME_SITE, value: lax}
            - {name: POSTGRES_URL, value: 'jdbc:postgresql://postgres:5432/petclinic'}
            - {name: POSTGRES_USER, value: petclinic}
            - name: POSTGRES_PASS
              valueFrom:
                secretKeyRef: {name: petclinic-db, key: password}
            - {name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE, value: 'health,info'}
            - {name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS, value: never}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: '1', memory: 768Mi}
          startupProbe:
            httpGet: {path: /actuator/health, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /actuator/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health, port: http}
            periodSeconds: 20
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 128Mi}
